{% extends "layout.html" %}
{% block content %}
<div class="h1">{{ title }}</div>

<div class="page-content">
   <div class="row g-4">
       <!-- Move TO Section -->
       <div class="col-lg-6">
           <div class="move-card card shadow-sm h-100">
               <div class="card-body">
                   <h5 class="card-title mb-4">
                       <i class="fa fa-arrow-right text-primary me-2"></i>
                       Premeštanje u izabranu prostoriju
                   </h5>
                   
                   <form action="" method="post">
                       <div class="move-form">
                           <div class="form-group mb-4">
                               <label class="form-label" for="serial_to_move_to">
                                   Serija predmeta
                               </label>
                               <select class="form-select" name="serial_to_move_to" 
                                       id="serial_to_move_to" required>
                                   <option value="">Izaberite seriju</option>
                                   {% for single_item in single_item_list_from %}
                                   <option value="{{single_item.serial}}">
                                       ({{single_item.serial}}) {{single_item.name}}
                                   </option>
                                   {% endfor %}
                               </select>
                           </div>
                           
                           <div class="form-group mb-4">
                               <label class="form-label" for="room_id_to_move_to">
                                   Ciljna prostorija
                               </label>
                               <select class="form-select" name="room_id_to_move_to" 
                                       id="room_id_to_move_to" required>
                                   <option value="">Izaberite prostoriju</option>
                                   {% for room in room_list_to %}
                                   <option value="{{room.id}}">
                                       {{ room.building.name }} > ({{ room.name }}) {{ room.dynamic_name }}
                                   </option>
                                   {% endfor %}
                               </select>
                           </div>
                           
                           <button class="btn btn-primary" type="submit" id="submit_to" name="submit_to">
                               <i class="fa fa-arrow-right me-2"></i>Dalje
                           </button>
                       </div>
                   </form>
               </div>
           </div>
       </div>

       <!-- Move FROM Section -->
       <div class="col-lg-6">
           <div class="move-card card shadow-sm h-100">
               <div class="card-body">
                   <h5 class="card-title mb-4">
                       <i class="fa fa-arrow-left text-primary me-2"></i>
                       Premeštanje iz izabrane prostorije
                   </h5>
                   
                   <form action="" method="post">
                       <div class="move-form">
                           <div class="form-group mb-4">
                               <label class="form-label" for="serial_to_move_from">
                                   Serija predmeta
                               </label>
                               <select class="form-select" name="serial_to_move_from" 
                                       id="serial_to_move_from" required>
                                   <option value="">Izaberite seriju</option>
                                   {% for single_item in single_item_list_from %}
                                   <option value="{{single_item.serial}}">
                                       ({{single_item.serial}}) {{single_item.name}}
                                   </option>
                                   {% endfor %}
                               </select>
                           </div>
                           
                           <div class="form-group mb-4">
                               <label class="form-label" for="room_id_to_move_from">
                                   Izvorna prostorija
                               </label>
                               <select class="form-select" name="room_id_to_move_from" 
                                       id="room_id_to_move_from" required>
                                   <option value="">Izaberite prostoriju</option>
                                   {% for room in room_list_from %}
                                   <option value="{{room.id}}">
                                       {{ room.building.name }} > ({{ room.name }}) {{ room.dynamic_name }}
                                   </option>
                                   {% endfor %}
                               </select>
                           </div>
                           
                           <button class="btn btn-primary" type="submit" id="submit_from" name="submit_from">
                               <i class="fa fa-arrow-right me-2"></i>Dalje
                           </button>
                       </div>
                   </form>
               </div>
           </div>
       </div>
   </div>
</div>
{% endblock content %}

{% block scripts %}
<script>
$(document).ready(function () {
   // Inicijalizacija Select2 za sve select elemente
   const select2Config = {
       placeholder: 'Izaberite opciju',
       allowClear: true,
       width: '100%',
       tags: false,
       closeOnSelect: true,
       theme: 'bootstrap-5'
   };

   $('#serial_to_move_to').select2(select2Config);
   $('#room_id_to_move_to').select2(select2Config);
   $('#serial_to_move_from').select2(select2Config);
   $('#room_id_to_move_from').select2(select2Config);
});
</script>

<style>
/* Card Styles */
.move-card {
   background: white;
   border: none;
   transition: transform 0.2s ease;
}

.move-card:hover {
   transform: translateY(-2px);
}

.card-title {
   color: var(--color-text);
   font-weight: 500;
}

/* Form Styles */
.form-label {
   font-size: 0.875rem;
   color: var(--color-text-light);
   margin-bottom: 0.5rem;
}

.form-select {
   border: 1px solid var(--color-border);
   border-radius: 6px;
   padding: 0.625rem 0.875rem;
}

.form-select:focus {
   border-color: var(--color-primary);
   box-shadow: 0 0 0 3px rgba(16, 78, 151, 0.1);
}

/* Select2 Customization */
.select2-container--bootstrap-5 .select2-selection {
   border: 1px solid var(--color-border);
   border-radius: 6px;
   min-height: 42px;
   padding: 0.375rem 0.75rem;
}

.select2-container--bootstrap-5 .select2-selection--single {
   background-color: white;
}

.select2-container--bootstrap-5 .select2-selection--single .select2-selection__rendered {
   color: var(--color-text);
   padding-left: 0;
}

.select2-container--bootstrap-5 .select2-selection--single .select2-selection__placeholder {
   color: #6c757d;
}

.select2-container--bootstrap-5 .select2-dropdown {
   border-color: var(--color-primary);
   box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.select2-container--bootstrap-5 .select2-results__option--highlighted[aria-selected] {
   background-color: var(--color-primary);
   color: white;
}

@media (max-width: 992px) {
   .move-card {
       margin-bottom: 1rem;
   }
}
</style>
{% endblock %}
